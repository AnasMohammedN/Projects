<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Retail Expiry & Inventory Intelligence System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-800 border-b border-gray-700 py-4 px-8 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-boxes-packing text-emerald-400 text-3xl"></i>
                <h1 class="text-xl font-bold tracking-wide">
                    Smart Retail <span class="text-emerald-400">Inventory Intelligence</span>
                </h1>
            </div>
            <div class="text-xs bg-gray-700 px-3 py-1.5 rounded-md text-gray-300 font-mono">
                System Status: <span class="text-emerald-400">Active</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Live Camera Stream Control Column -->
        <section class="lg:col-span-5 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-camera text-emerald-400"></i> AI Scan Terminal
                </h2>
                <div class="flex space-x-2">
                    <button id="start-btn" onclick="startCamera()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg transition duration-200">
                        Start Cam
                    </button>
                    <button id="stop-btn" onclick="stopCamera()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-1.5 rounded-lg transition duration-200" disabled>
                        Stop Cam
                    </button>
                </div>
            </div>

            <!-- Viewfinder Layer Wrapper -->
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video border border-gray-600 flex items-center justify-center">
                <video id="webcam" autoplay playsinline muted class="hidden w-full h-full object-cover"></video>
                <canvas id="output-canvas" class="w-full h-full object-cover"></canvas>
                <div id="status-overlay" class="absolute inset-0 bg-black/75 flex flex-col items-center justify-center text-gray-400 space-y-2">
                    <i class="fa-solid fa-video-slash text-4xl mb-2"></i>
                    <p class="text-sm">Camera Stream Offline</p>
                </div>
            </div>
            
            <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/50 space-y-2">
                <div class="text-sm font-semibold text-gray-300">Live Diagnostics Output</div>
                <div id="terminal-feed" class="text-xs font-mono text-emerald-500 max-h-28 overflow-y-auto space-y-1">
                    <div class="text-gray-500">> System Ready to Analyze...</div>
                </div>
            </div>
        </section>

        <!-- Dynamic Realtime Inventory Log Table -->
        <section class="lg:col-span-7 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl flex flex-col min-h-[500px]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-warehouse text-emerald-400"></i> Real-time Stock Ledger
                </h2>
                <button onclick="fetchInventory()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
                </button>
            </div>

            <div class="flex-grow overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4">Product Name</th>
                            <th class="py-3 px-4">Scanned On</th>
                            <th class="py-3 px-4">Expiry Date</th>
                            <th class="py-3 px-4">Days Left</th>
                            <th class="py-3 px-4">Status Flag</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body" class="divide-y divide-gray-700/50 text-sm">
                        <!-- Populated dynamic list -->
                    </tbody>
                </table>
                <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                    <i class="fa-solid fa-inbox text-4xl mb-2 block"></i>
                    No products captured in active state.
                </div>
            </div>
        </section>
    </main>

    <!-- UI Implementation Scripts -->
    <script>
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output-canvas');
        let ctx = canvas.getContext('2d');
        let stream = null;
        let isRunning = false;
        let scanInterval = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('status-overlay').classList.add('hidden');
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
                isRunning = true;
                
                // Keep virtual processing resolution matches natural bounds
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    // Run real-time background inference cycle at ~1 frame per second
                    scanInterval = setInterval(processFrame, 1000);
                };
            } catch (err) {
                logTerminal("Camera initiation failure: " + err.message, "text-rose-500");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(scanInterval);
            video.classList.add('hidden');
            document.getElementById('status-overlay').classList.remove('hidden');
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            isRunning = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function logTerminal(message, textColorClass = "text-emerald-500") {
            const terminal = document.getElementById('terminal-feed');
            const timestamp = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = `font-mono text-xs ${textColorClass}`;
            logItem.innerHTML = `<span>[${timestamp}]</span> > ${message}`;
            terminal.appendChild(logItem);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function processFrame() {
            if (!isRunning) return;

            // Render current frame buffer down onto localized context surface
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frameData = canvas.toDataURL('image/jpeg', 0.85);

            try {
                let response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: frameData })
                });

                let result = await response.json();
                if (result.error) throw new Error(result.error);

                // Re-draw native annotations returned by the engine
                if (result.annotated_image) {
                    let img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = result.annotated_image;
                }

                // Process logs
                if (result.detections.length > 0) {
                    result.detections.forEach(det => {
                        logTerminal(`Detected: ${det.name} (Conf: ${det.confidence}) - Expiry: ${det.expiry}`);
                    });
                }
                
                if (result.items_added && result.items_added.length > 0) {
                    result.items_added.forEach(item => {
                        logTerminal(`SUCCESS: Added ${item.name} with expiry ${item.expiry_date} to DB!`, "text-yellow-400 font-semibold");
                    });
                    fetchInventory(); // Live reload changes
                }

            } catch (err) {
                logTerminal(`Processing Error: ${err.message}`, "text-rose-400");
            }
        }

        async function fetchInventory() {
            try {
                let response = await fetch('/api/inventory');
                let data = await response.json();
                
                const tbody = document.getElementById('inventory-body');
                const emptyState = document.getElementById('empty-state');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                data.forEach(item => {
                    let statusColor = "";
                    let daysText = item.days_left !== null ? `${item.days_left} Days` : "N/A";
                    
                    if (item.status === "Expired") {
                        statusColor = "bg-rose-500/20 text-rose-400 border border-rose-500/30";
                    } else if (item.status === "Expiring Soon") {
                        statusColor = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
                    } else {
                        statusColor = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800 transition">
                            <td class="py-3.5 px-4 font-semibold text-gray-100">${item.name}</td>
                            <td class="py-3.5 px-4 text-gray-400 font-mono text-xs">${item.scan_date}</td>
                            <td class="py-3.5 px-4 text-gray-300 font-mono text-xs font-semibold">${item.expiry_date}</td>
                            <td class="py-3.5 px-4 font-mono text-xs">${daysText}</td>
                            <td class="py-3.5 px-4">
                                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">
                                    ${item.status}
                                </span>
                            </td>
                            <td class="py-3.5 px-4 text-right">
                                <button onclick="deleteItem(${item.id})" class="text-gray-500 hover:text-rose-400 transition">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Inventory refresh failure:", err);
            }
        }

        async function deleteItem(id) {
            if (confirm("Remove this entry from the Active Inventory database?")) {
                await fetch(`/api/delete/${id}`, { method: 'DELETE' });
                fetchInventory();
            }
        }

        // Initialize inventory table on page load
        window.onload = fetchInventory;
    </script>
</body>
</html>
